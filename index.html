<!DOCTYPE html>
<html lang="ru" data-theme="silver">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Diary">
  <meta name="theme-color" content="#0b0c10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.github.com https://*.workers.dev">
  <title>My Diary</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="silver.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div><div class="grain"></div></div>
  <div id="app">
    <div id="titlebar">
      <div class="tb-title"><img src="icon.svg" alt="">My Diary</div>
      <div class="tb-right"><button id="gem-badge" class="gem-badge" title="Кристаллы — мини-игры"></button>
      <div class="win-ctrls">
        <button id="w-min" title="Свернуть"><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg></button>
        <button id="w-max" title="Развернуть"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
        <button id="w-close" class="close" title="Закрыть"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg></button>
      </div></div>
    </div>
    <div id="main">
      <div id="side-handle"><div class="arrow glass"><svg viewBox="0 0 12 12"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      <nav id="sidebar" class="glass"></nav>
      <div id="views"></div>
    </div>
  </div>
  <script src="js/webapi.js"></script>
  <script src="js/util.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/store.js"></script>
  <script src="js/metrics.js"></script>
  <script src="js/components.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/silhouette.js"></script>
  <script src="js/sleepline.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/report.js"></script>
  <script src="js/care-coupons.js"></script>
  <script src="js/game.js"></script>
  <script src="js/tests-data.js"></script>
  <script src="js/articles.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/day.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/tests.js"></script>
  <script src="js/views/library.js"></script>
  <script src="js/relics.js"></script>
  <script src="js/caseart.js"></script>
  <script src="js/spinners.js"></script>
  <script src="js/recipes-d1.js"></script>
  <script src="js/recipes-d2.js"></script>
  <script src="js/recipes-d3.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/dishart.js"></script>
  <script src="js/views/games.js"></script>
  <script src="js/journal-data.js"></script>
  <script src="js/views/journal.js"></script>
  <script src="js/views/sync-ui.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/export.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mobile.js"></script>
</body>
</html>
